events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        location /nginx-health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 200 "Synapse API Gateway — coming soon\n";
            add_header Content-Type text/plain;
        }
    }
}
