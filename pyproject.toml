[project]
name = "synapse"
version = "0.1.0"
description = "Local-first GraphRAG MVP backend for Synapse"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0",
    "pymupdf>=1.24,<2.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.6,<1.0",
    "neo4j>=5.18,<7.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic-settings>=2.2,<3.0",
    "qdrant-client>=1.9,<2.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
observability = [
    "langfuse>=2.0",
    "opentelemetry-sdk>=1.20,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]
dev = [
    "grandalf>=0.8",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["docs*", "frontend*", "infra*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
