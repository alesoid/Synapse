[project]
name = "synapse"
version = "0.1.0"
description = "Local-first GraphRAG MVP backend for Synapse"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.6,<1.0",
    "neo4j>=5.18,<7.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic-settings>=2.2,<3.0",
    "qdrant-client>=1.9,<2.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
observability = [
    "langfuse>=2.0",
]
dev = [
    "grandalf>=0.8",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["docs*", "frontend*", "infra*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
